services:
    app:
      build: .
      container_name: mini-acquiring-app
      ports:
        - "8080:8080"
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mini_acquiring
        SPRING_DATASOURCE_USERNAME: ma_admin
        SPRING_DATASOURCE_PASSWORD: ma_admin
        SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      depends_on:
        - db
        - kafka
        - redis
      networks:
        - mini-acquiring-network

    db:
      image: postgres:17
      container_name: mini-acquiring-db
      environment:
        POSTGRES_DB: mini_acquiring
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      ports:
        - "5433:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      networks:
        - mini-acquiring-network

    kafka:
      image: apache/kafka:4.1.0
      container_name: mini-acquiring-kafka
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      volumes:
        - kafka_data:/var/lib/kafka/data
      networks:
        - mini-acquiring-network

    redis:
      image: redis:7.4-alpine
      container_name: mini-acquiring-redis
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data
      command: redis-server --appendonly yes
      networks:
        - mini-acquiring-network

volumes:
  postgres_data:
  kafka_data:
  redis_data:

networks:
  mini-acquiring-network:
    external: true
