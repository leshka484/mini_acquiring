server:
port: 8080

spring:
  application:
    name: mini-acquiring
  data:
    redis:
      host: redis
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.miniacquiring.core.dto
        spring.json.type.mapping:
          com.example.kafkaproducer.core.dto.ProcessOperationMessage:com.example.miniacquiring.core.dto.ProcessOperationMessage,
          com.example.kafkaproducer.core.dto.CreateOperationMessage:com.example.miniacquiring.core.dto.CreateOperationMessage
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: jdbc:postgresql://localhost:5432/mini_acquiring
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

commission:
  scheduler:
    cron: "0 * * * * *"

logging:
  level:
    org.hibernate: OFF
    org.springframework: WARN
    org.apache.kafka: WARN