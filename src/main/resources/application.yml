spring:
  application:
    name: mini-acquiring

  datasource:
    url: jdbc:postgresql://localhost:5432/mini_acquiring
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

commission:
  scheduler:
    cron: "0 0 * * * *"